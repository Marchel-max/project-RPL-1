<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoServis - Kasir / Transaksi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">AutoServis SaaS</h1>
            <div class="space-x-4">
                <a href="/" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg">Stok Inventaris</a>
                <a href="/kasir" class="text-sm bg-white text-blue-600 font-semibold px-3 py-1.5 rounded-lg">Kasir / POS</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Form Transaksi (Kiri) -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Transaksi Baru</h2>
            
            <form action="/proses_transaksi" method="POST" id="transaksiForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Nama Pelanggan / Plat Nomor</label>
                    <input type="text" name="nama_pelanggan" placeholder="Contoh: B 1234 XYZ (Pak Budi)" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- Input Item Sparepart -->
                <div class="border-t pt-4">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-2">Pilih Sparepart</label>
                    <div class="flex gap-2 mb-4">
                        <select id="select_item" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">-- Pilih Barang --</option>
                            {% for item in items %}
                            <option value="{{ item.id }}" data-nama="{{ item.nama_barang }}" data-harga="{{ item.harga_jual }}" data-stok="{{ item.stok }}">
                                {{ item.kode_barang }} - {{ item.nama_barang }} (Stok: {{ item.stok }} | Rp {{ "{:,.0f}".format(item.harga_jual) }})
                            </option>
                            {% endfor %}
                        </select>
                        <input type="number" id="input_jumlah" value="1" min="1" class="w-20 p-2 border border-gray-300 rounded-lg text-sm">
                        <button type="button" onclick="tambahKeKeranjang()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow">
                            + Tambah
                        </button>
                    </div>
                </div>

                <!-- Tabel Keranjang -->
                <div class="overflow-x-auto border border-gray-200 rounded-lg">
                    <table class="w-full text-left text-sm" id="tabelKeranjang">
                        <thead class="bg-gray-50 text-xs text-gray-600 uppercase">
                            <tr>
                                <th class="p-3">Barang</th>
                                <th class="p-3">Harga</th>
                                <th class="p-3">Qty</th>
                                <th class="p-3">Subtotal</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <!-- Items dimasukkan via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Hidden inputs untuk dikirim ke backend Flask -->
                <div id="hiddenInputs"></div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" id="btnProses" disabled class="bg-gray-400 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow cursor-not-allowed">
                        Proses Transaksi & Potong Stok
                    </button>
                </div>
            </form>
        </div>

        <!-- Ringkasan Pembayaran (Kanan) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between">
            <div>
                <h3 class="text-lg font-bold text-gray-900 border-b pb-3 mb-4">Ringkasan Pembayaran</h3>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-500">Total Item</span>
                        <span id="textTotalQty" class="font-semibold">0 pcs</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold border-t pt-3">
                        <span>Total Bayar</span>
                        <span id="textTotalBayar" class="text-blue-600">Rp 0</span>
                    </div>
                </div>
            </div>
            <p class="text-xs text-gray-400 mt-6">* Stok barang akan berkurang secara otomatis dari database setelah transaksi diproses.</p>
        </div>
    </div>

    <!-- JavaScript Logika Keranjang -->
    <script>
        let keranjang = [];

        function tambahKeKeranjang() {
            const select = document.getElementById('select_item');
            const selectedOption = select.options[select.selectedIndex];
            const qty = parseInt(document.getElementById('input_jumlah').value);

            if (!select.value) return alert("Pilih barang terlebih dahulu!");
            
            const id = select.value;
            const nama = selectedOption.dataset.nama;
            const harga = parseInt(selectedOption.dataset.harga);
            const stok = parseInt(selectedOption.dataset.stok);

            if (qty > stok) {
                return alert("Stok tidak mencukupi! Stok tersedia: " + stok);
            }

            const existing = keranjang.find(item => item.id === id);
            if (existing) {
                if (existing.qty + qty > stok) {
                    return alert("Jumlah melebihi stok yang ada!");
                }
                existing.qty += qty;
                existing.subtotal = existing.qty * harga;
            } else {
                keranjang.push({ id, nama, harga, qty, subtotal: harga * qty });
            }

            renderKeranjang();
        }

        function hapusItem(index) {
            keranjang.splice(index, 1);
            renderKeranjang();
        }

        function renderKeranjang() {
            const tbody = document.querySelector('#tabelKeranjang tbody');
            const hiddenInputs = document.getElementById('hiddenInputs');
            tbody.innerHTML = '';
            hiddenInputs.innerHTML = '';

            let grandTotal = 0;
            let totalQty = 0;

            keranjang.forEach((item, index) => {
                grandTotal += item.subtotal;
                totalQty += item.qty;

                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-medium text-gray-900">${item.nama}</td>
                        <td class="p-3">Rp ${item.harga.toLocaleString()}</td>
                        <td class="p-3 font-semibold">${item.qty}</td>
                        <td class="p-3 font-semibold text-blue-600">Rp ${item.subtotal.toLocaleString()}</td>
                        <td class="p-3 text-center">
                            <button type="button" onclick="hapusItem(${index})" class="text-xs text-red-600 hover:underline">Hapus</button>
                        </td>
                    </tr>
                `;

                hiddenInputs.innerHTML += `
                    <input type="hidden" name="inventory_id[]" value="${item.id}">
                    <input type="hidden" name="jumlah[]" value="${item.qty}">
                    <input type="hidden" name="harga_satuan[]" value="${item.harga}">
                `;
            });

            document.getElementById('textTotalQty').innerText = totalQty + ' pcs';
            document.getElementById('textTotalBayar').innerText = 'Rp ' + grandTotal.toLocaleString();

            const btn = document.getElementById('btnProses');
            if (keranjang.length > 0) {
                btn.disabled = false;
                btn.className = "bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow cursor-pointer transition";
            } else {
                btn.disabled = true;
                btn.className = "bg-gray-400 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow cursor-not-allowed";
            }
        }
    </script>
</body>
</html>
