<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Toko Baru - AutoServis POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl border border-gray-700 p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center text-emerald-400 text-3xl mx-auto mb-3">
                <i class="fa-solid fa-store"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Daftar Akun Toko Baru</h2>
            <p class="text-gray-400 text-sm mt-1">Mulai kelola inventaris & kasir toko kamu gratis</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Nama Toko / Usaha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-shop"></i>
                    </span>
                    <input type="text" name="nama_toko" required placeholder="Contoh: Toko Berkah Jaya" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Email Toko</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="nama@tokomu.com" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="text-xs font-medium text-gray-300 block mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Buat password aman" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-600/30 mt-2">
                Daftar Toko Sekarang
            </button>
        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            Sudah punya akun? 
            <a href="/login" class="text-emerald-400 hover:underline font-medium">Masuk di sini</a>
        </p>
    </div>

</body>
</html>
